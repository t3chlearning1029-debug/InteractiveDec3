<style>

--se-green: #009e4d;

  }

  *{box-sizing:border-box}
  body{

}
  header{

  padding: 16px 24px;
}
  h1{
font-size: 1.4rem;
  margin: 0;
}

.top-navbar{

    position:sticky;
    top:0;
    z-index:1000;
}

.nav-btn{
    border:none;
    border-radius:6px;
    padding:10px 16px;
    cursor:pointer;
    font-weight:600;
    background:#f3f4f6;
    transition:0.2s;
}

.nav-btn:hover{
    background:#e5e7eb;
}

.nav-primary{
    background:var(--se-green);
    color:white;
}

#nodeView {
    min-height: auto;
    display: flex;
    flex-direction: column;
    justify-content: flex-start; /* move to top */
    align-items: center;         /* keep centered horizontally */
    text-align: center;
    width: 100%;
    padding-top: 20px;           /* adjust spacing from top */
}

#nodeView .question {
    text-align: center;
    max-width: 900px;
    margin-bottom: 20px;
}

#nodeView .options {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
    width: 100%;
}

#nodeView .step {
    max-width: 700px;
    width: 100%;
    margin: 8px auto;
    text-align: center;
}

#nodeView .tag.action {
    text-align: center;
    margin: 20px auto;
}

  .subtitle{margin:0;color:var(--muted)}
  main{max-width:1100px;margin:24px auto;padding:0 16px}
  
  @media (max-width: 900px) {
    .layout {
        grid-template-columns: 1fr;
    }
}
  .panel{
background: var(--se-card);
  border: 1px solid var(--se-border);
  border-radius: 8px;
}
  .panel h2{
background: #fafafa;
  padding: 12px;

  border-bottom: 1px solid var(--se-border);
  text-transform: uppercase;
}
  .panel-body{padding: 16px;}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
  .btn{
border: 1px solid var(--se-border);

  cursor: pointer;
}
  .btn.accent{
background: var(--se-green);
  color: white;
  border: none;

}
  .btn:hover {
  opacity: 0.9;
}
  .btn.good{border-color:var(--good);color:#fff;background:var(--good)}

  .btn.bad{border-color:var(--bad);color:#fff;background:var(--bad)}
  .select{
width: 100%;
  padding: 10px;
  border: 1px solid var(--se-border);
  border-radius: 6px;

.batt-good {
    color: #16a34a;
    font-weight: bold;
}

.batt-old {
    color: #dc2626;
    font-weight: bold;
}
.node{
    display:flex;
    flex-direction:column;
    justify-content:flex-start;
    align-items:right;
    text-align:right;
    min-height:auto;
    padding-top:10px;

.model-row{

    align-items:center;

.model-row .select{

.go-btn{

.layout {
    display: grid;

    gap: 20px;
    align-items: start;

.left-column {
    background: var(--se-card);
    border: 1px solid var(--se-border);
    border-radius: 8px;
    padding: 16px;

.right-column {
    background: var(--se-card);

    padding: 16px;

#nodeView{

.path-panel{

.region-btn:hover{

function calculateBatteryAge(serial) {
  if (!serial) return null;

  serial = serial.trim().toUpperCase();

  // Example: 7A2134101920
  const match = serial.match(/^.{2}(\d{2})(\d{2})/);

  if (!match) return null;

  const year = 2000 + parseInt(match[1], 10);
  const week = parseInt(match[2], 10);

  if (week < 1 || week > 53) return null;

  const manufactureDate = new Date(year, 0, 1);
  manufactureDate.setDate(
    manufactureDate.getDate() + ((week - 1) * 7)
  );

  const today = new Date();

  const ageYears =
    (today - manufactureDate) /
    (1000 * 60 * 60 * 24 * 365.25);

  return ageYears;
}

function getBatteryDecision() {

  const serial =
    document.getElementById("batterySerialInput")?.value.trim();

  const age = calculateBatteryAge(serial);

  if (age === null) return "newbatt_action";

}

function selectOption(o){
  // Handle redirect to another tree
  if(o.next && o.next.startsWith('goto_')){
  const target = o.next.replace('goto_', '');

  if (typeof symptomSelect !== 'undefined' && symptomSelect) {
    symptomSelect.value = target;
  }

  startSymptom(target);
  return;
}
  history.push({symptom: currentSymptom, nodeId: o.next, label: o.label});
  goto(o.next);
}

function goto(nodeId){

  if (nodeId === "batteryage_auto") {
    nodeId = getBatteryDecision();
  }

  renderNode(nodeId);
  
}

function renderPath(){
  const pathEl = document.getElementById('path');

  if (!pathEl) {
    return;
  }

  pathEl.innerHTML = '';

  history.forEach((h, idx) => {

    const li = document.createElement('li');
    li.textContent = `${idx === 0 ? 'Start' : 'Step'}: ${
      decisionTree[h.symptom].nodes[h.nodeId].text
    }`;

    li.className = (h.nodeId === currentNodeId) ? 'current' : '';

    const tag = document.createElement('span');
    tag.className = 'tag symptom';
    tag.textContent = h.symptom;

    li.appendChild(tag);
    pathEl.appendChild(li);

  });
}

function getFullPathFrom(startNodeId) {
    const nodes = [];
    let current = startNodeId;

    while (current) {
        const node = decisionTree[currentSymptom].nodes[current];
        if (!node) break;

        nodes.push({ nodeId: current, node });

        if (node.type === "action") {
            current = node.next;
        } else {
            break;
        }
    }

    return nodes;
}
